<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма подписки - 33 Зуб</title>
    <style>
        /* Стили для формы подписки */
        .newsletter-widget {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            margin: 20px auto;
        }

        .newsletter-widget h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.2rem;
        }

        .newsletter-widget p {
            margin-bottom: 15px;
            color: #666;
            font-size: 0.9rem;
        }

        .newsletter-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .newsletter-form input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .newsletter-form button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .newsletter-form button:hover:not(:disabled) {
            background: #0056b3;
        }

        .newsletter-form button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message-success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            display: none;
        }

        .message-error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="newsletter-widget">
        <h3>Подпишитесь на рассылку</h3>
        <p>Получайте новости и акции от нашей клиники</p>
        <form id="newsletterForm" class="newsletter-form">
            <input type="email" id="newsletterEmail" placeholder="Введите ваш email" required>
            <button type="submit" id="subscribeBtn">Подписаться</button>
        </form>
        <div class="message-success" id="successMessage">
            Спасибо за подписку! Вы будете получать наши новости.
        </div>
        <div class="message-error" id="errorMessage">
            Ошибка при подписке. Возможно, вы уже подписаны.
        </div>
    </div>

    <script>
        document.getElementById('newsletterForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const subscribeBtn = document.getElementById('subscribeBtn');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const emailInput = document.getElementById('newsletterEmail');
            
            // Скрыть сообщения
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            
            const email = emailInput.value.trim();
            
            // Валидация email
            if (!email) {
                errorMessage.textContent = 'Пожалуйста, введите email адрес.';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Блокировка кнопки
            subscribeBtn.disabled = true;
            subscribeBtn.textContent = 'Подписка...';
            
            try {
                // Отправка на backend API
                const response = await fetch('http://localhost:8000/api/v1/subscriber/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });
                
                if (response.ok) {
                    // Успешно
                    successMessage.style.display = 'block';
                    emailInput.value = '';
                } else {
                    // Ошибка
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = 'Ошибка при подписке. Возможно, вы уже подписаны.';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Ошибка сети. Проверьте подключение.';
            } finally {
                // Разблокировка кнопки
                subscribeBtn.disabled = false;
                subscribeBtn.textContent = 'Подписаться';
            }
        });
    </script>
</body>
</html>
